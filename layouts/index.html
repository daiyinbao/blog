{{ define "main" }}
<h1 class="home-title">{{ site.Title }}</h1>
{{- with site.Params.description }}
<p class="home-desc">{{ . }}</p>
{{- end }}
<div class="homepage-tree tree">
  {{- with site.GetPage "/blog" }}
    {{- partial "tree.html" (dict "section" . "current" $ "showDate" true "collapsed" false) }}
  {{- end }}
</div>
{{ end }}
