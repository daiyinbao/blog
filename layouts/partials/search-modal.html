<div class="search-modal" id="search-modal">
  <div class="search-modal-content">
    <div class="mobile-search-header">
      <button class="mobile-icon-btn" id="mobile-exit-btn" aria-label="返回">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
    </div>
    <div class="search-input-wrapper">
      <svg class="desktop-only" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="{{ site.Params.searchPlaceholder }}" autocomplete="off" spellcheck="false">
      <button class="mobile-icon-btn mobile-search-submit" id="mobile-search-btn" aria-label="搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="search-loading" style="display:none;padding:20px;text-align:center;opacity:.6;">加载中…</div>
    <div class="search-footer desktop-only">
      <span>↑↓ 选择</span>
      <span>↵ 打开</span>
      <span>esc 关闭</span>
    </div>
  </div>
</div>
