<header>
  <div class="header-inner">
    <div class="header-left">
      <button class="mobile-menu-btn" id="mobile-menu-btn" type="button"
              aria-label="目录" aria-controls="sidebar-left" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <img src="{{ site.Params.avatar | strings.TrimPrefix "/" | relURL }}" alt="Avatar" class="header-avatar">
      <a href="{{ site.Home.RelPermalink }}" class="header-title">{{ site.Title }}</a>
      <a href="{{ site.Home.RelPermalink }}" class="header-home-btn" title="首页" aria-label="首页">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </div>
    <div class="header-right">
      <a href="{{ site.Params.aboutURL | strings.TrimPrefix "/" | relURL }}" class="header-about-btn">关于我</a>
      <button id="mobile-search-trigger" class="mobile-search-btn" aria-label="搜索">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox" title="切换主题">
          <input type="checkbox" id="checkbox">
          <div class="slider round">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </div>
        </label>
        <script>
          (function () {
            var box = document.getElementById("checkbox");
            if (box && document.documentElement.getAttribute("data-theme") === "dark") box.checked = true;
          })();
        </script>
      </div>
    </div>
  </div>
</header>
