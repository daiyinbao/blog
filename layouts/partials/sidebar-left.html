<div class="sidebar-left tree" id="sidebar-left">
  <div class="search-trigger" id="search-trigger">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57L14 14.71V15.5l5 4.99L20.49 19 15.5 14zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
    </span>
    <span class="search-text">{{ site.Params.searchPlaceholder }}</span>
  </div>
  <h3>{{ site.Params.sidebarTitle }}</h3>
  {{- with site.GetPage "/blog" }}
    {{- partial "tree.html" (dict "section" . "current" $ "showDate" false "collapsed" true) }}
  {{- end }}
</div>
