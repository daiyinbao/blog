# /etc/nginx/conf.d/blog.conf   （Debian/Ubuntu 也可以放 /etc/nginx/sites-available/blog 再软链到 sites-enabled/）
# 静态博客 Nginx 配置。改 server_name 和 root 即可。
server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;      # ← 改成你的域名（没有域名就填服务器 IP）

    root /var/www/blog;                # ← 改成 public/ 上传后的目录
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;

    # 干净 URL：/blog/xxx/ → /blog/xxx/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # 带内容指纹的 CSS/JS，可以长期强缓存
    location ~* ^/(css|js)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 图片/字体
    location ~* \.(svg|png|jpe?g|gif|webp|avif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 搜索索引不要缓存，保证新文章能立刻被搜到
    location = /index.json {
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
